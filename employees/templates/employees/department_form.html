{% extends "employees/base.html" %}

{% block title %}{{ page_title }} | EmployeeHub{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h3 class="fw-bold mb-4">
                    {{ page_title }}
                </h3>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Department
                    </button>

                    <a
                        href="{% url 'employees:department_list' %}"
                        class="btn btn-light"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
