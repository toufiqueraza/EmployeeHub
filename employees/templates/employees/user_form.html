{% extends "employees/base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">

        <div class="card shadow-sm">
            <div class="card-header">
                <h4 class="mb-0">
                    {% if edit_mode %}
                        Edit User
                    {% else %}
                        Create User
                    {% endif %}
                </h4>
            </div>

            <div class="card-body">

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            value="{{ user_obj.username|default:'' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ user_obj.email|default:'' }}"
                        >
                    </div>

                    {% if not edit_mode %}
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >
                        </div>
                    {% endif %}

                    <div class="mb-4">
                        <label class="form-label">Role</label>

                        <select name="role" class="form-select" required>
                            <option value="">Select role</option>

                            {% for group in groups %}
                                <option
                                    value="{{ group.name }}"
                                    {% if current_group.name == group.name %}
                                        selected
                                    {% endif %}
                                >
                                    {{ group.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {% if edit_mode %}
                                Save Changes
                            {% else %}
                                Create User
                            {% endif %}
                        </button>

                        <a
                            href="{% url 'employees:user_list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
